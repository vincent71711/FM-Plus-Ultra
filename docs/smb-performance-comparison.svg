<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Measured SMB transfer checkpoints</title>
  <desc id="desc">Horizontal bar comparison of upload and download throughput measured during FM Plus Ultra development on a Galaxy Z Fold7 and TrueNAS server.</desc>
  <rect width="920" height="520" rx="18" fill="#ffffff"/>
  <text x="34" y="46" font-family="system-ui, sans-serif" font-size="25" font-weight="700" fill="#1f2328">Measured SMB transfer checkpoints</text>
  <text x="34" y="74" font-family="system-ui, sans-serif" font-size="14" fill="#59636e">Galaxy Z Fold7 ↔ TrueNAS test environment · MB/s</text>

  <rect x="610" y="35" width="18" height="12" rx="3" fill="#941f35"/>
  <text x="636" y="46" font-family="system-ui, sans-serif" font-size="13" fill="#30363d">Upload</text>
  <rect x="720" y="35" width="18" height="12" rx="3" fill="#606b78"/>
  <text x="746" y="46" font-family="system-ui, sans-serif" font-size="13" fill="#30363d">Download</text>

  <g stroke="#d8dee4" stroke-width="1">
    <line x1="250" y1="96" x2="250" y2="430"/>
    <line x1="390" y1="96" x2="390" y2="430"/>
    <line x1="530" y1="96" x2="530" y2="430"/>
    <line x1="670" y1="96" x2="670" y2="430"/>
    <line x1="810" y1="96" x2="810" y2="430"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#6e7781" text-anchor="middle">
    <text x="250" y="452">0</text>
    <text x="390" y="452">30</text>
    <text x="530" y="452">60</text>
    <text x="670" y="452">90</text>
    <text x="810" y="452">120 MB/s</text>
  </g>

  <g font-family="system-ui, sans-serif" fill="#24292f">
    <text x="34" y="128" font-size="15" font-weight="600">Inherited path</text>
    <text x="34" y="147" font-size="12" fill="#6e7781">Observed cross-provider upload</text>
    <rect x="250" y="112" width="6" height="18" rx="4" fill="#941f35"/>
    <text x="266" y="127" font-size="13" font-weight="600">1.1</text>
    <text x="250" y="151" font-size="12" fill="#6e7781">Download not formally recorded</text>

    <text x="34" y="218" font-size="15" font-weight="600">Portable Java checkpoint</text>
    <text x="34" y="237" font-size="12" fill="#6e7781">Controlled 2 GiB test</text>
    <rect x="250" y="196" width="134" height="18" rx="4" fill="#941f35"/>
    <text x="392" y="211" font-size="13" font-weight="600">28.8</text>
    <rect x="250" y="222" width="160" height="18" rx="4" fill="#606b78"/>
    <text x="418" y="237" font-size="13" font-weight="600">34.2</text>

    <text x="34" y="308" font-size="15" font-weight="600">First native-security pass</text>
    <text x="34" y="327" font-size="12" fill="#6e7781">Hybrid provider enabled</text>
    <rect x="250" y="286" width="244" height="18" rx="4" fill="#941f35"/>
    <text x="502" y="301" font-size="13" font-weight="600">52.4</text>
    <rect x="250" y="312" width="417" height="18" rx="4" fill="#606b78"/>
    <text x="675" y="327" font-size="13" font-weight="600">89.4</text>

    <text x="34" y="398" font-size="15" font-weight="600">Final tuned hybrid pipeline</text>
    <text x="34" y="417" font-size="12" fill="#6e7781">Native security + bounded requests</text>
    <rect x="250" y="376" width="427" height="18" rx="4" fill="#941f35"/>
    <text x="685" y="391" font-size="13" font-weight="600">91.5</text>
    <rect x="250" y="402" width="556" height="18" rx="4" fill="#606b78"/>
    <text x="814" y="417" font-size="13" font-weight="600">119.2</text>
  </g>

  <text x="34" y="486" font-family="system-ui, sans-serif" font-size="12" fill="#6e7781">Observed development checkpoints, not a universal performance guarantee. Later rows used repeatable 2 GiB tests.</text>
</svg>
